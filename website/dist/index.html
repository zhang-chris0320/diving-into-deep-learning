  <style>
    @font-face {

    :root {
      --ink: #112235;
      --muted: #64748b;
      --paper: #f5f7fb;
      --card: #ffffff;

      --teal: #0e9f8b;
      --amber: #e99520;
      --violet: #7657df;

      --shadow: 0 18px 48px rgba(16, 39, 68, .09);
      font-family: "WenKai", "Kaiti SC", "STKaiti", "Songti SC", serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {

    .app-shell { min-height: 100vh; }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      padding: 14px clamp(18px, 4vw, 64px);
      background: rgba(245,247,251,.90);
      border-bottom: 1px solid rgba(219,228,238,.86);
      backdrop-filter: blur(18px);
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: .02em; }
    .brand-mark {
      display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px;
      color: #fff; background: var(--ink); box-shadow: 4px 4px 0 rgba(47,111,237,.22);
      font-family: Georgia, serif; font-size: 22px; font-weight: 400;
    }
    .eyebrow, .source-chip { color: var(--muted); font-size: 13px; font-weight: 400; }
    .source-chip { white-space: nowrap; }
    .container { width: min(1480px, calc(100% - 36px)); margin: 0 auto; }
    .hero {
      display: grid; grid-template-columns: minmax(300px, .78fr) minmax(520px, 1.22fr); gap: 34px;
      align-items: center; padding: 42px 0 32px;
    }
    .kicker { margin: 0 0 10px; color: var(--blue); font-size: 14px; font-weight: 700; letter-spacing: .14em; }
    h1 { max-width: 720px; margin: 0; font-size: clamp(34px, 5vw, 68px); line-height: 1.08; letter-spacing: -.045em; }
    .hero-copy > p:not(.kicker) { max-width: 650px; margin: 22px 0 0; color: #4d6278; font-size: 18px; }
    .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    .stat {
      display: inline-flex; align-items: baseline; gap: 7px; padding: 8px 12px; border: 1px solid var(--line);
      border-radius: 12px; background: rgba(255,255,255,.68); color: var(--muted); font-size: 13px;
    }
    .stat strong { color: var(--ink); font-size: 20px; }
    .hero-map {
      position: relative; min-height: 260px; padding: 14px; overflow: hidden; border: 1px solid var(--line); border-radius: 26px;
      background: linear-gradient(145deg, rgba(255,255,255,.94), rgba(236,243,250,.84)); box-shadow: var(--shadow);
    }
    .hero-map img { display: block; width: 100%; height: 268px; object-fit: contain; border-radius: 17px; background: #f7fbff; }
    .hero-map::after { content: "卷积 · 注意力 · 循环 · 编码器"; position: absolute; right: 24px; bottom: 21px; padding: 5px 10px; color: #41566f; background: rgba(255,255,255,.9); border: 1px solid #d7e4f1; border-radius: 999px; font-size: 12px; letter-spacing: .05em; }
    .workspace { display: grid; grid-template-columns: 310px minmax(0, 1fr); gap: 22px; padding: 18px 0 72px; }
    .module-rail, .detail-stage { border: 1px solid var(--line); border-radius: 24px; background: rgba(255,255,255,.78); box-shadow: var(--shadow); }
    .module-rail { align-self: start; position: sticky; top: 78px; max-height: calc(100vh - 100px); overflow: auto; padding: 18px; }
    .rail-head { display: flex; align-items: end; justify-content: space-between; margin: 0 2px 14px; }
    .rail-head h2 { margin: 0; font-size: 20px; }
    .rail-head span { color: var(--muted); font-size: 13px; }
    .module-list { display: grid; gap: 9px; }
    .module-button {
      position: relative; display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 10px;
      width: 100%; padding: 11px 10px; color: var(--ink); text-align: left; cursor: pointer;
      border: 1px solid transparent; border-radius: 15px; background: transparent; transition: .18s ease;
    }
    .module-button:hover { background: #f2f6fc; border-color: #dce7f4; transform: translateX(2px); }
    .module-button.is-active { background: #ecf3ff; border-color: #b9d0ff; box-shadow: inset 4px 0 0 var(--accent); }
    .module-icon { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px; color: #fff; background: var(--accent); font-family: Georgia, serif; font-size: 18px; }
    .module-copy strong { display: block; font-size: 15px; line-height: 1.25; }
    .module-copy small { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
    .module-chapter { align-self: start; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .detail-stage { min-width: 0; padding: clamp(20px, 3vw, 36px); }
    .detail-toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-bottom: 18px; color: var(--muted); font-size: 14px; }
    .chapter-badge { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; border: 1px solid #cddbeb; border-radius: 999px; background: #f7faff; }
    .chapter-badge i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .detail-grid { display: grid; grid-template-columns: minmax(250px, .56fr) minmax(0, 1.44fr); gap: 26px; align-items: start; }
    .detail-intro h2 { margin: 0; font-size: clamp(30px, 4vw, 52px); line-height: 1.08; letter-spacing: -.04em; }
    .detail-intro .summary { margin: 18px 0 0; color: #4d6278; font-size: 17px; }
    .note-card { margin-top: 22px; padding: 16px; border-left: 4px solid var(--accent); border-radius: 15px; background: #f1f6fd; }
    .note-card strong { display: block; margin-bottom: 6px; color: var(--accent); font-size: 14px; }
    .note-card p { margin: 0; color: #3c536d; font-size: 15px; }
    .code-entry { margin-top: 22px; }
    .code-entry h3 { margin: 0 0 9px; font-size: 14px; color: var(--muted); }
    .code-link { display: block; margin-top: 7px; padding: 9px 11px; overflow-wrap: anywhere; color: #34577f; border: 1px solid var(--line); border-radius: 10px; background: #fbfdff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; text-decoration: none; }
    .code-link:hover { border-color: #aac6ee; color: var(--blue); }
    .diagram-card { min-width: 0; padding: 16px; overflow: hidden; border: 1px solid var(--line); border-radius: 22px; background: linear-gradient(145deg, #fbfdff, #edf4fb); }
    .diagram-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .diagram-head h3 { margin: 0; font-size: 15px; }
    .diagram-head span { color: var(--muted); font-size: 13px; }
    .diagram-viewport { width: 100%; overflow-x: auto; overflow-y: hidden; padding: 3px 0 12px; scrollbar-color: #b9cbe0 transparent; scrollbar-width: thin; }
    #diagram { display: block; height: auto; max-width: none; overflow: visible; }
    .diagram-bg { fill: #f8fbff; stroke: #d6e3f0; stroke-width: 1.2; }
    .diagram-lane { fill: none; stroke: #d2dfec; stroke-width: 1.5; stroke-dasharray: 5 8; }
    .diagram-node .node-card { fill: #fff; stroke: color-mix(in srgb, var(--accent) 72%, #ffffff); stroke-width: 2; filter: url(#nodeShadow); }
    .diagram-node .visual-pad { fill: color-mix(in srgb, var(--accent) 10%, #ffffff); }
    .diagram-node .visual-stroke { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .diagram-node .visual-fill { fill: color-mix(in srgb, var(--accent) 18%, #ffffff); stroke: var(--accent); stroke-width: 1.8; }
    .diagram-node .visual-solid { fill: var(--accent); }
    .diagram-node .visual-dot { fill: #fff; stroke: var(--accent); stroke-width: 1.8; }
    .diagram-node .node-label { fill: #152b44; font: 700 15px "WenKai", "Kaiti SC", serif; text-anchor: middle; }
    .diagram-node .node-sub { fill: #667b91; font: 12.5px "WenKai", "Kaiti SC", serif; text-anchor: middle; }
    .diagram-arrow { fill: none; stroke: var(--accent); stroke-width: 2.2; marker-end: url(#arrow); }
    .diagram-arrow.secondary { stroke: #94a8bd; stroke-dasharray: 5 6; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 13px; padding-top: 11px; border-top: 1px solid #dbe4ee; color: var(--muted); font-size: 12px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend b { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
    .module-footer { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
    .module-footer span { padding: 5px 9px; border-radius: 999px; background: #f0f4f9; }
    .empty { padding: 28px; text-align: center; color: var(--muted); }
    @media (max-width: 1240px) {
      .detail-grid { grid-template-columns: 1fr; }
      .detail-intro { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, .8fr); gap: 12px 24px; align-items: start; }
      .detail-intro h2, .detail-intro .summary { grid-column: 1; }
      .note-card, .code-entry { grid-column: 2; }
      .note-card { grid-row: 1 / span 2; margin-top: 0; }
      .code-entry { margin-top: 0; }
    }
    @media (max-width: 1000px) {
      .hero { grid-template-columns: 1fr; }
      .hero-map { max-width: 920px; }
      .workspace { grid-template-columns: 1fr; }
      .module-rail { position: static; max-height: none; }
      .module-list { display: flex; overflow-x: auto; padding-bottom: 4px; }
      .module-button { min-width: 220px; }
    }
    @media (max-width: 720px) {
      .topbar { align-items: flex-start; flex-direction: column; gap: 5px; }
      .source-chip { white-space: normal; }
      .container { width: min(100% - 24px, 1480px); }
      .hero { padding-top: 30px; }
      .hero-map { padding: 8px; }
      .hero-map img { height: 210px; }
      .hero-map::after { right: 14px; bottom: 13px; }
      .hero-copy > p:not(.kicker) { font-size: 16px; }
      .detail-grid { grid-template-columns: 1fr; }
      .detail-intro { display: block; }
      .note-card, .code-entry { margin-top: 18px; }
      .diagram-card { padding: 12px; }
      .diagram-head { align-items: flex-start; flex-direction: column; gap: 2px; }
      .module-button { min-width: 200px; }
    }
  </style>

<body>
  <div class="app-shell">
    <header class="topbar">

    <main class="container">

        <div class="hero-copy">
          <p class="kicker">读代码前先看结构</p>

          <p>按章节浏览网络模块。先看图形化的数据流，再看核心模块、输出和对应的纯 PyTorch 代码。</p>

        </section>
      </section>
    </main>

  <script>
    const modules = [
      {id:'linear', chapter:'03', chapterName:'线性神经网络', title:'线性回归 / Softmax 回归', category:'线性模型', icon:'λ', accent:'#2f6fed', summary:'从一个线性映射开始，理解特征、logits、损失函数和分类输出如何连接起来。', note:'先看输入特征如何进入 nn.Linear，再看回归值或类别 logits 如何交给损失函数。Softmax 回归使用交叉熵时直接处理 logits。', tags:['线性映射','logits','交叉熵'], code:['chapters/chapter_03_linear_networks/linear_regression.py','chapters/chapter_03_linear_networks/softmax_regression_concise.py'], nodes:[['输入特征','样本张量','input'],['nn.Linear','线性映射','dense'],['预测值 / logits','模型输出','output']]},
      {id:'mlp', chapter:'04', chapterName:'多层感知机', title:'多层感知机 MLP', category:'全连接网络', icon:'⊙', accent:'#2f6fed', summary:'用 Linear、ReLU 和多层组合把线性模型扩展成能够拟合非线性关系的全连接网络。', note:'ReLU 是关键的非线性节点；读代码时逐层核对输入维度、隐藏维度和最后的类别数。', tags:['Linear','ReLU','Dropout / 权重衰减'], code:['chapters/chapter_04_multilayer_perceptrons/mlp_concise.py','chapters/chapter_04_multilayer_perceptrons/dropout.py'], nodes:[['输入特征','784 维','input'],['Linear','256 units','dense'],['ReLU','非线性','activation'],['Linear','10 类','output']]},
      {id:'lenet', chapter:'06', chapterName:'卷积神经网络', title:'LeNet', category:'经典 CNN', icon:'▦', accent:'#0e9f8b', summary:'第一张完整的卷积分类网络图：卷积提取局部特征，池化压缩空间尺寸，全连接层完成分类。', note:'沿着图从左向右看尺寸变化：1×28×28 图像经过两组 Conv + Pool，最后变成 10 类输出。', tags:['Conv2d','MaxPool','分类头'], code:['chapters/chapter_06_convolutional_neural_networks/lenet.py'], nodes:[['图像','1×28×28','input'],['Conv','6 个特征图','conv'],['Pool','空间压缩','pool'],['Conv','16 个特征图','conv'],['Pool','空间压缩','pool'],['FC','120→84→10','output']]},
      {id:'alexnet', chapter:'07', chapterName:'现代卷积神经网络', title:'AlexNet', category:'深层 CNN', icon:'▥', accent:'#0e9f8b', summary:'用更深的卷积堆叠、更大的数据增强和 Dropout 把图像分类推向深层网络。', note:'卷积主干负责提取层级特征，最后的 FC 堆叠负责把图像表示映射到类别。', tags:['卷积堆叠','MaxPool','Dropout'], code:['chapters/chapter_07_modern_convolutional_networks/alexnet.py'], nodes:[['图像','输入','input'],['Conv Block','局部特征','conv'],['Pool','下采样','pool'],['FC Block','高维表示','dense'],['类别','输出 logits','output']]},
      {id:'vgg', chapter:'07', chapterName:'现代卷积神经网络', title:'VGG', category:'深层 CNN', icon:'▤', accent:'#0e9f8b', summary:'用结构规整、可重复的卷积块构建深度网络，图形上像一串层层叠叠的积木。', note:'每个 VGG block 通常由多个 Conv + ReLU 组成，Pool 负责阶段切换和尺寸压缩。', tags:['重复卷积块','模块化','分类头'], code:['chapters/chapter_07_modern_convolutional_networks/vgg.py'], nodes:[['图像','输入','input'],['VGG Block × N','Conv + ReLU','conv'],['Pool','阶段切换','pool'],['FC','分类头','dense'],['类别','输出','output']]},
      {id:'inception', chapter:'07', chapterName:'现代卷积神经网络', title:'GoogLeNet / Inception', category:'多分支 CNN', icon:'✣', accent:'#0e9f8b', summary:'不同尺度的卷积并行工作，再把分支结果沿通道方向合并。', note:'图中的四条分支代表不同感受野；Concat 是汇合点，读代码时注意通道数相加。', tags:['多分支','1×1 Conv','Concat'], code:['chapters/chapter_07_modern_convolutional_networks/googlenet.py'], mode:'branches'},

    const moduleList = document.getElementById('moduleList');
    const moduleCount = document.getElementById('moduleCount');
    const detailChapter = document.querySelector('#detailChapter b');
    const detailChapterDot = document.querySelector('#detailChapter i');

    const detailSummary = document.getElementById('detailSummary');
    const detailNote = document.getElementById('detailNote');
    const codeLinks = document.getElementById('codeLinks');

    const diagramCaption = document.getElementById('diagramCaption');
    const diagram = document.getElementById('diagram');
    const esc = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    function visualFor(kind, w) {
      const cx = w / 2;
      if (kind === 'input') return `<rect class="visual-fill" x="${cx-28}" y="17" width="48" height="48" rx="8"></rect><path class="visual-stroke" d="M ${cx-20} 54 l12-13 9 8 11-17 10 22"></path><circle class="visual-solid" cx="${cx+9}" cy="29" r="4"></circle>`;
      if (kind === 'conv') return `<rect class="visual-fill" x="${cx-32}" y="25" width="48" height="42" rx="7"></rect><rect class="visual-fill" x="${cx-23}" y="18" width="48" height="42" rx="7"></rect><rect class="visual-fill" x="${cx-14}" y="11" width="48" height="42" rx="7"></rect><path class="visual-stroke" d="M ${cx-5} 20 v24 M ${cx+7} 20 v24 M ${cx+19} 20 v24 M ${cx-5} 28 h36 M ${cx-5} 36 h36"></path>`;

      if (kind === 'dense') return `<path class="visual-stroke" d="M ${cx-25} 18 L ${cx+23} 23 M ${cx-25} 18 L ${cx+23} 47 M ${cx-25} 42 L ${cx+23} 23 M ${cx-25} 42 L ${cx+23} 47 M ${cx-25} 62 L ${cx+23} 47"></path><circle class="visual-dot" cx="${cx-25}" cy="18" r="6"></circle><circle class="visual-dot" cx="${cx-25}" cy="42" r="6"></circle><circle class="visual-dot" cx="${cx-25}" cy="62" r="6"></circle><circle class="visual-solid" cx="${cx+23}" cy="23" r="7"></circle><circle class="visual-solid" cx="${cx+23}" cy="47" r="7"></circle>`;
      if (kind === 'activation') return `<path class="visual-stroke" d="M ${cx-31} 60 H ${cx+32} M ${cx-22} 68 V 10 M ${cx-18} 57 H ${cx-2} L ${cx+18} 25 H ${cx+31}"></path><circle class="visual-solid" cx="${cx+18}" cy="25" r="5"></circle>`;
      if (kind === 'recurrent') return `<rect class="visual-fill" x="${cx-22}" y="25" width="44" height="34" rx="10"></rect><path class="visual-stroke" d="M ${cx+20} 35 C ${cx+44} 22, ${cx+43} 65, ${cx+19} 53 M ${cx+37} 49 l-3 10-9-3"></path><path class="visual-stroke" d="M ${cx-34} 42 H ${cx-24} M ${cx+24} 42 H ${cx+34}"></path>`;
      if (kind === 'attention') return `<circle class="visual-dot" cx="${cx-28}" cy="22" r="6"></circle><circle class="visual-dot" cx="${cx-28}" cy="43" r="6"></circle><circle class="visual-dot" cx="${cx-28}" cy="64" r="6"></circle><circle class="visual-solid" cx="${cx+28}" cy="43" r="9"></circle><path class="visual-stroke" d="M ${cx-21} 22 L ${cx+19} 41 M ${cx-21} 43 H ${cx+19} M ${cx-21} 64 L ${cx+19} 45"></path>`;

      return `<rect class="visual-fill" x="${cx-31}" y="15" width="62" height="48" rx="10"></rect><circle class="visual-solid" cx="${cx-12}" cy="39" r="8"></circle><rect class="visual-solid" x="${cx+2}" y="29" width="20" height="7" rx="3"></rect><rect class="visual-solid" x="${cx+2}" y="43" width="14" height="7" rx="3"></rect>`;

    function svgNode(x, y, w, h, node) {
      return `<g class="diagram-node" transform="translate(${x},${y})">
        <rect class="node-card" width="${w}" height="${h}" rx="22"></rect>
        <rect class="visual-pad" x="12" y="10" width="${w-24}" height="66" rx="15"></rect>

        <text class="node-label" x="${w/2}" y="99">${esc(node[0])}</text>
        <text class="node-sub" x="${w/2}" y="120">${esc(node[1])}</text>
      </g>`;
    }
    function arrow(x1, y1, x2, y2, secondary=false) { return `<path class="diagram-arrow${secondary ? ' secondary' : ''}" d="M ${x1} ${y1} C ${(x1+x2)/2} ${y1}, ${(x1+x2)/2} ${y2}, ${x2} ${y2}"></path>`; }
    function base(width, height, lanes='') { return `<rect class="diagram-bg" x="18" y="18" width="${width-36}" height="${height-36}" rx="30"></rect>${lanes}`; }

    function renderSequence(item) {
      const nodes = item.nodes || [['输入','张量','input'],['网络模块','特征变换','dense'],['输出','结果','output']];
      const w = 146, h = 136, gap = 38, start = 48, y = 132;
      const width = Math.max(860, start * 2 + nodes.length * w + (nodes.length - 1) * gap);
      const height = 400;
      let markup = base(width, height, `<path class="diagram-lane" d="M 44 ${y+h/2} H ${width-44}"></path>`);
      nodes.forEach((node, i) => {
        const x = start + i * (w + gap);
        markup += svgNode(x, y, w, h, node);
        if (i < nodes.length - 1) markup += arrow(x+w+7, y+h/2, start+(i+1)*(w+gap)-7, y+h/2);
      });
      return {markup, width, height};
    }
    function renderResidual() {
      const width = 1040, height = 450, w = 158, h = 136, y = 224;
      const xs = [48, 288, 548, 818];
      let markup = base(width, height, `<path class="diagram-lane" d="M 44 ${y+h/2} H ${width-44} M 126 116 H 704"></path>`);
      markup += arrow(xs[0]+w+8,y+h/2,xs[1]-8,y+h/2)+arrow(xs[1]+w+8,y+h/2,xs[2]-8,y+h/2)+arrow(xs[2]+w+8,y+h/2,xs[3]-8,y+h/2);
      markup += `<path class="diagram-arrow secondary" d="M ${xs[0]+w/2} ${y-8} C ${xs[0]+w/2} 102, ${xs[2]+w/2} 102, ${xs[2]+w/2} ${y-8}"></path>`;
      markup += svgNode(xs[0],y,w,h,['输入','特征图','input'])+svgNode(xs[1],y,w,h,['Conv Block','主分支','conv'])+svgNode(xs[2],y,w,h,['相加节点','残差融合','concat'])+svgNode(xs[3],y,w,h,['输出','更新表示','output']);
      markup += svgNode(330,48,w,h,['Identity','捷径分支','attention']);
      return {markup,width,height};
    }
    function renderBranches() {
      const width = 1120, height = 540, w = 170, h = 136, inputX = 48, branchX = 300, mergeX = 650, outputX = 900, centerY = 202;
      const ys = [42,202,362];
      let markup = base(width,height,`<path class="diagram-lane" d="M 44 ${centerY+h/2} H ${width-44}"></path>`);
      ys.forEach((y,i)=>{ markup += arrow(inputX+w+8,centerY+h/2,branchX-8,y+h/2)+arrow(branchX+w+8,y+h/2,mergeX-8,centerY+h/2); });
      markup += arrow(mergeX+w+8,centerY+h/2,outputX-8,centerY+h/2);
      markup += svgNode(inputX,centerY,w,h,['输入','共享特征','input'])+svgNode(branchX,ys[0],w,h,['1×1 Conv','局部映射','conv'])+svgNode(branchX,ys[1],w,h,['3×3 Conv','中等感受野','conv'])+svgNode(branchX,ys[2],w,h,['5×5 / Pool','大尺度信息','pool'])+svgNode(mergeX,centerY,w,h,['Concat','合并通道','concat'])+svgNode(outputX,centerY,w,h,['输出','汇总特征','output']);
      return {markup,width,height};
    }
    function renderMulti() {
      const width = 1110, height = 500, w = 170, h = 136, inputX = 48, featureX = 300, headX = 570, outputX = 870, centerY = 182;
      const ys = [74,290];
      let markup = base(width,height,`<path class="diagram-lane" d="M 44 ${centerY+h/2} H ${width-44}"></path>`);
      ys.forEach(y=>{ markup += arrow(inputX+w+8,centerY+h/2,featureX-8,y+h/2)+arrow(featureX+w+8,y+h/2,headX-8,y+h/2)+arrow(headX+w+8,y+h/2,outputX-8,centerY+h/2); });
      markup += svgNode(inputX,centerY,w,h,['Backbone','共享特征','input'])+svgNode(featureX,ys[0],w,h,['高分辨率特征','小目标','conv'])+svgNode(featureX,ys[1],w,h,['低分辨率特征','大目标','conv'])+svgNode(headX,ys[0],w,h,['Class Head','类别概率','dense'])+svgNode(headX,ys[1],w,h,['Box Head','边界框','dense'])+svgNode(outputX,centerY,w,h,['NMS','筛选候选','output']);
      return {markup,width,height};
    }
    function renderTransformer(item) {
      if (item.id !== 'bert') {
        return renderSequence({...item,nodes:[['Token','输入序列','input'],['位置编码','加入顺序','activation'],['多头注意力','连接上下文','attention'],['Encoder × N','提取表示','recurrent'],['Decoder × N','逐步生成','recurrent'],['Softmax','输出词元','output']]});
      }
      const width = 1080, height = 500, w = 170, h = 136, inputX = 48, embedX = 280, encoderX = 520, headX = 780, ys = [72,292], centerY = 182;
      let markup = base(width,height,`<path class="diagram-lane" d="M 44 ${centerY+h/2} H ${width-44}"></path>`);
      markup += arrow(inputX+w+8,centerY+h/2,embedX-8,centerY+h/2)+arrow(embedX+w+8,centerY+h/2,encoderX-8,centerY+h/2)+arrow(encoderX+w+8,centerY+h/2,headX-8,ys[0]+h/2)+arrow(encoderX+w+8,centerY+h/2,headX-8,ys[1]+h/2);
      markup += svgNode(inputX,centerY,w,h,['Token / Segment','输入索引','input'])+svgNode(embedX,centerY,w,h,['三种嵌入','加上位置','dense'])+svgNode(encoderX,centerY,w,h,['Encoder × N','双向表示','attention'])+svgNode(headX,ys[0],w,h,['MLM Head','预测遮盖词','dense'])+svgNode(headX,ys[1],w,h,['NSP Head','句间关系','output']);
      return {markup,width,height};
    }
    function renderDiagram(item) {
      diagram.style.setProperty('--accent', item.accent);
      const result = item.mode === 'residual' ? renderResidual() : item.mode === 'branches' ? renderBranches() : item.mode === 'multi' ? renderMulti() : item.mode === 'transformer' ? renderTransformer(item) : renderSequence(item);
      diagram.setAttribute('viewBox', `0 0 ${result.width} ${result.height}`);
      diagram.setAttribute('width', result.width);
      diagram.setAttribute('height', result.height);
      diagram.style.width = `${result.width}px`;
      diagram.innerHTML = `<defs><filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#183651" flood-opacity=".10"></feDropShadow></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="${item.accent}"></path></marker></defs>${result.markup}`;
      const viewport = diagram.closest('.diagram-viewport');
      if (viewport) viewport.scrollLeft = 0;
    }
    function renderModules(activeId) {
      moduleList.innerHTML = modules.map(m => `<button class="module-button${m.id === activeId ? ' is-active' : ''}" style="--accent:${m.accent}" data-id="${m.id}"><span class="module-icon">${m.icon}</span><span class="module-copy"><strong>${esc(m.title)}</strong><small>第 ${m.chapter} 章 · ${esc(m.category)}</small></span><span class="module-chapter">${m.chapter}</span></button>`).join('');
      moduleList.querySelectorAll('.module-button').forEach(button => button.addEventListener('click', () => selectModule(button.dataset.id)));
    }
    function selectModule(id) {
      const item = modules.find(m => m.id === id) || modules[0];
      document.documentElement.style.setProperty('--accent', item.accent);
      detailChapterDot.style.background = item.accent;
      detailChapter.textContent = `第 ${item.chapter} 章 · ${item.chapterName}`;
      detailCategory.textContent = item.category;
      detailTitle.textContent = item.title;
      detailSummary.textContent = item.summary;
      detailNote.textContent = item.note;
      diagramCaption.textContent = `第 ${item.chapter} 章 · ${item.category}`;
      codeLinks.innerHTML = item.code.map(path => `<a class="code-link" href="#" title="源码位于配套代码包：${esc(path)}">${esc(path)}</a>`).join('');
      moduleFooter.innerHTML = item.tags.map(tag => `<span>${esc(tag)}</span>`).join('');
      renderDiagram(item);
      renderModules(item.id);
    }
    moduleCount.textContent = `${modules.length} 个模块`;
    selectModule('resnet');
  </script>
